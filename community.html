<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHRUG — Side Quests</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111110">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="supabase.js"></script>
  <script src="db.js"></script>
  <script src="data.js"></script>
</head>
<body>

<nav class="bottom-nav" id="bottom-nav">
  <a href="index.html" class="bnav-item" data-page="discover"><span class="bnav-icon">🧭</span><span class="bnav-label">Discover</span></a>
  <a href="results.html" class="bnav-item" id="bnav-arc" data-page="arc"><span class="bnav-icon">🎯</span><span class="bnav-label">My Arc</span></a>
  <a href="shelf.html" class="bnav-item" data-page="shelf"><span class="bnav-icon">🖼️</span><span class="bnav-label">Shelf</span></a>
  <a href="map.html" class="bnav-item" data-page="map"><span class="bnav-icon">🗺️</span><span class="bnav-label">Map</span></a>
  <a href="community.html" class="bnav-item active" data-page="community"><span class="bnav-icon">⚡</span><span class="bnav-label">Side Quests</span></a>
</nav>

<nav class="nav" id="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">SHRUG</a>
    <div id="nav-user"></div>
  </div>
</nav>

<div class="page-hero">
  <div class="page-hero-label" id="week-label">Week [N] · 2026</div>
  <div class="page-hero-heading">SIDE QUESTS</div>
  <div class="page-hero-sub">One weekend. A real deliverable. No hobby required.</div>
</div>

<div class="page-content">

  <!-- Generate -->
  <div style="padding-top:28px;padding-bottom:4px">
    <button class="btn-generate-sq" id="btn-generate-sq" onclick="generateSideQuest()">✦ Generate a side quest for me</button>
    <div id="generated-sidequests" style="margin-top:12px"></div>
  </div>

  <!-- All quests -->
  <div style="padding-top:20px;padding-bottom:32px">
    <div class="sec-hdr mt-0" style="margin-bottom:4px">All side quests</div>
    <div style="font-size:13px;color:var(--mid);margin-bottom:16px">👍 like what you'd do · 👎 not your thing — we use it to improve your generations</div>
    <div id="all-sidequests"></div>
  </div>

</div>

<script>
(function() {
  var navEl = document.getElementById('nav');
  window.addEventListener('scroll', function() { navEl.classList.toggle('stuck', window.scrollY > 10); }, { passive: true });

  var currentUser = null;
  var WEEK_NUM = getISOWeek();
  var YEAR = new Date().getFullYear();
  var PREFS_KEY = 'shrug_sq_prefs';

  document.getElementById('week-label').textContent = 'Week ' + WEEK_NUM + ' \u00b7 ' + YEAR;

  // ── Preference storage ────────────────────────────────────
  function getPrefs() {
    try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch(e) { return {}; }
  }
  function setVote(id, val) {
    var prefs = getPrefs();
    if (prefs[id] === val) { delete prefs[id]; } // toggle off
    else { prefs[id] = val; }
    localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
    renderVoteButtons(id, prefs[id]);
  }
  window.sqVote = function(id, val) { setVote(id, val); };

  function renderVoteButtons(id, currentVal) {
    var row = document.getElementById('sq-vote-' + id);
    if (!row) return;
    row.innerHTML =
      '<button class="sq-vote-btn' + (currentVal === 1 ? ' active-like' : '') + '" onclick="sqVote(\'' + id + '\',1)">\uD83D\uDC4D</button>' +
      '<button class="sq-vote-btn' + (currentVal === -1 ? ' active-dislike' : '') + '" onclick="sqVote(\'' + id + '\',-1)">\uD83D\uDC4E</button>';
  }

  // ── Card builder ──────────────────────────────────────────
  function buildSideQuestCard(quest, opts) {
    var full = opts && opts.showFull;
    var prefs = getPrefs();
    var vote = prefs[quest.id];
    var likedClass = vote === 1 ? ' sq-card-liked' : '';

    return '<div class="sidequest-card' + likedClass + '" id="sqcard-' + quest.id + '">' +
      '<div class="sidequest-header">' +
        '<span class="sidequest-icon">' + quest.icon + '</span>' +
        '<div style="flex:1">' +
          '<div class="sidequest-duration">\u23f1 ' + quest.duration.toUpperCase() + '</div>' +
          '<div class="sidequest-title">' + quest.title + '</div>' +
        '</div>' +
        '<div class="sq-vote-row" id="sq-vote-' + quest.id + '">' +
          '<button class="sq-vote-btn' + (vote === 1 ? ' active-like' : '') + '" onclick="sqVote(\'' + quest.id + '\',1)">\uD83D\uDC4D</button>' +
          '<button class="sq-vote-btn' + (vote === -1 ? ' active-dislike' : '') + '" onclick="sqVote(\'' + quest.id + '\',-1)">\uD83D\uDC4E</button>' +
        '</div>' +
      '</div>' +
      '<div class="sidequest-goal">' + quest.goal + '</div>' +
      (full
        ? '<div class="sidequest-needs-label">WHAT YOU NEED</div>' +
          '<ul class="sidequest-needs">' + quest.needs.map(function(n) { return '<li>' + n + '</li>'; }).join('') + '</ul>' +
          '<div class="sidequest-steps-label">THE STEPS</div>' +
          '<ol class="sidequest-steps">' + quest.steps.map(function(s) { return '<li>' + s + '</li>'; }).join('') + '</ol>' +
          '<button class="sidequest-expand" onclick="collapseSideQuest(\'' + quest.id + '\')" style="margin-top:12px">Collapse \u2191</button>'
        : '<button class="sidequest-expand" onclick="expandSideQuest(\'' + quest.id + '\')">See the steps \u2192</button>'
      ) +
    '</div>';
  }

  window.expandSideQuest = function(id) {
    var quests = (typeof SIDE_QUESTS !== 'undefined') ? SIDE_QUESTS : [];
    var quest = quests.filter(function(q) { return q.id === id; })[0];
    if (!quest) return;
    var el = document.getElementById('sqcard-' + id);
    if (el) el.outerHTML = buildSideQuestCard(quest, { showFull: true });
  };

  window.collapseSideQuest = function(id) {
    var quests = (typeof SIDE_QUESTS !== 'undefined') ? SIDE_QUESTS : [];
    var quest = quests.filter(function(q) { return q.id === id; })[0];
    if (!quest) return;
    var el = document.getElementById('sqcard-' + id);
    if (el) el.outerHTML = buildSideQuestCard(quest, { showFull: false });
  };

  // ── Generate side quest ───────────────────────────────────
  window.generateSideQuest = async function() {
    var btn = document.getElementById('btn-generate-sq');
    var container = document.getElementById('generated-sidequests');
    if (!btn || !container) return;
    btn.textContent = 'Generating\u2026';
    btn.disabled = true;

    // Build preference context
    var prefs = getPrefs();
    var likedIds = Object.keys(prefs).filter(function(k) { return prefs[k] === 1; });
    var dislikedIds = Object.keys(prefs).filter(function(k) { return prefs[k] === -1; });
    var quests = (typeof SIDE_QUESTS !== 'undefined') ? SIDE_QUESTS : [];

    if (typeof _shrugIsConfigured === 'undefined' || !_shrugIsConfigured) {
      // Demo: pick a random un-disliked quest
      var candidates = quests.filter(function(q) { return prefs[q.id] !== -1; });
      if (!candidates.length) candidates = quests;
      var sq = candidates[Math.floor(Math.random() * candidates.length)];
      if (sq) {
        var genQuest = Object.assign({}, sq, { id: 'gen-' + Date.now() });
        container.insertAdjacentHTML('afterbegin', buildSideQuestCard(genQuest, { showFull: true }));
      }
      btn.textContent = '\u2726 Generate another';
      btn.disabled = false;
      return;
    }

    try {
      var likedTitles = likedIds.map(function(id) {
        var q = quests.filter(function(x) { return x.id === id; })[0];
        return q ? q.title : '';
      }).filter(Boolean);
      var result = await supabaseClient.functions.invoke('generate-project', {
        body: {
          type: 'sidequest',
          liked: likedTitles.slice(0, 3),
          disliked: dislikedIds.slice(0, 3)
        }
      });
      if (result.data && result.data.quest) {
        var q = result.data.quest;
        q.id = 'gen-' + Date.now();
        container.insertAdjacentHTML('afterbegin', buildSideQuestCard(q, { showFull: true }));
      }
    } catch(e) {}
    btn.textContent = '\u2726 Generate another';
    btn.disabled = false;
  };

  // ── Render all quests ─────────────────────────────────────
  function renderAllQuests() {
    var quests = (typeof SIDE_QUESTS !== 'undefined') ? SIDE_QUESTS : [];
    var container = document.getElementById('all-sidequests');
    if (!container || !quests.length) return;
    container.innerHTML = quests.map(function(q) {
      return buildSideQuestCard(q, { showFull: false });
    }).join('');
  }

  // ── Initialize ───────────────────────────────────────────
  renderAllQuests();

  getCurrentUser().then(function(user) {
    currentUser = user;
    var navUser = document.getElementById('nav-user');
    if (navUser) {
      navUser.innerHTML = user
        ? '<button onclick="signOut()" class="nav-signout">Sign out</button>'
        : '';
    }

    // Update My Arc nav
    var arcEl = document.getElementById('bnav-arc');
    var results2 = null;
    try { results2 = JSON.parse(sessionStorage.getItem('shrugResults')); } catch(e) {}
    if (arcEl && results2 && results2.ranked && results2.ranked.length) {
      arcEl.href = 'hobby.html?key=' + results2.ranked[0].key;
    }
  });

  function getISOWeek() {
    var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + 4 - (d.getDay() || 7));
    var y = new Date(d.getFullYear(), 0, 1);
    return Math.ceil(((d - y) / 86400000 + 1) / 7);
  }
})();
</script>
</body>
</html>
