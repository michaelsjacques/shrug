<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHRUG — Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111110">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="supabase.js"></script>
  <script src="db.js"></script>
  <script src="data.js"></script>
</head>
<body>

<nav class="bottom-nav" id="bottom-nav">
  <a href="index.html" class="bnav-item" data-page="discover"><span class="bnav-icon">🧭</span><span class="bnav-label">Discover</span></a>
  <a href="results.html" class="bnav-item" id="bnav-arc" data-page="arc"><span class="bnav-icon">🎯</span><span class="bnav-label">My Arc</span></a>
  <a href="shelf.html" class="bnav-item" data-page="shelf"><span class="bnav-icon">🖼️</span><span class="bnav-label">Shelf</span></a>
  <a href="map.html" class="bnav-item" data-page="map"><span class="bnav-icon">🗺️</span><span class="bnav-label">Map</span></a>
  <a href="community.html" class="bnav-item active" data-page="community"><span class="bnav-icon">👥</span><span class="bnav-label">Community</span></a>
</nav>

<nav class="nav" id="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">SHRUG</a>
    <div id="nav-user"></div>
  </div>
</nav>

<div class="page-hero">
  <div class="page-hero-label" id="week-label">Week [N] · 2026</div>
  <div class="page-hero-heading">THIS WEEK'S CHALLENGE</div>
  <div class="page-hero-sub">Share what you tried. See what others made.</div>
</div>

<div class="page-content">
  <!-- Hobby selector -->
  <div style="padding-top:24px">
    <div class="sec-hdr mt-0" style="margin-bottom:12px">Pick a hobby</div>
    <div class="hobby-pill-row" id="hobby-selector">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- Current prompt card -->
  <div id="prompt-section" style="padding-bottom:8px">
    <!-- Populated by JS -->
  </div>

  <!-- Community feed -->
  <div style="padding:24px 0 16px">
    <div class="sec-hdr mt-0" style="margin-bottom:16px">What people made this week</div>
    <div id="community-feed">
      <div style="color:var(--mid);font-size:14px">Loading…</div>
    </div>
  </div>
</div>

<script>
(function() {
  var navEl = document.getElementById('nav');
  window.addEventListener('scroll', function() { navEl.classList.toggle('stuck', window.scrollY > 10); }, { passive: true });

  var currentUser = null;
  var currentKey = null;
  var WEEK_NUM = getISOWeek();
  var YEAR = new Date().getFullYear();

  // Update week label
  document.getElementById('week-label').textContent = 'Week ' + WEEK_NUM + ' · ' + YEAR;

  // Demo feed entries for first launch
  var DEMO_FEED = [
    { hobby_key: 'photography', text: 'Tried the rule of thirds challenge — kept putting my cat in the center by habit!', icon: '📷' },
    { hobby_key: 'baking', text: 'Made sourdough for the first time. It\'s alive now. Scary and exciting.', icon: '🥐' },
    { hobby_key: 'drawing', text: 'Drew my hand 6 times. By attempt 5 it finally looked like a hand.', icon: '✏️' },
    { hobby_key: 'yoga', text: 'Held warrior II for a full minute today. My legs disagreed.', icon: '🧘' },
  ];

  function renderFeed(entries, userSubmission) {
    var feed = document.getElementById('community-feed');
    var items = (entries && entries.length) ? entries : DEMO_FEED;

    feed.innerHTML = items.map(function(item, i) {
      var isYours = userSubmission && item.text === userSubmission.text;
      var hobbyData = HOBBIES && item.hobby_key ? HOBBIES[item.hobby_key] : null;
      var hobbyLabel = hobbyData ? (hobbyData.icon || '') + ' ' + (item.hobby_key.charAt(0).toUpperCase() + item.hobby_key.slice(1)) : (item.hobby_key || '');
      var avatarEmoji = (hobbyData && hobbyData.icon) ? hobbyData.icon : ['🌿','🎯','✨','🔥','💡'][i % 5];

      return '<div class="community-feed-item">' +
        '<div class="community-feed-avatar">' + avatarEmoji + '</div>' +
        '<div>' +
          '<div class="community-feed-text">' + item.text + (isYours ? '<span class="community-yours-badge">you</span>' : '') + '</div>' +
          '<div class="community-feed-meta">' + hobbyLabel + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  async function selectHobbyForCommunity(key) {
    currentKey = key;
    document.querySelectorAll('.hobby-tree-pill').forEach(function(p) {
      p.classList.toggle('active', p.getAttribute('data-key') === key);
    });

    var h = HOBBIES && HOBBIES[key] ? HOBBIES[key] : null;
    var project = h ? h.project : null;
    var prompt = project ? (project.chTask || project.challenge || '') : '';

    // Check if user already submitted this week
    var alreadySubmitted = null;
    if (currentUser) {
      alreadySubmitted = await getUserWeeklySubmission(currentUser.id, key);
    } else {
      var localKey2 = 'shrug_weekly_anon';
      try {
        var local = JSON.parse(localStorage.getItem(localKey2)) || [];
        alreadySubmitted = local.find(function(s) { return s.hobby_key === key && s.week_num === WEEK_NUM && s.year === YEAR; }) || null;
      } catch(e) {}
    }

    var promptSection = document.getElementById('prompt-section');
    var html = '<div class="community-prompt-card">';
    html += '<div class="community-week-label">Week ' + WEEK_NUM + ' · ' + (key.charAt(0).toUpperCase() + key.slice(1)) + '</div>';
    html += '<div class="community-prompt-task">' + (prompt || 'Try the Week 1 challenge for this hobby.') + '</div>';

    if (alreadySubmitted) {
      html += '<div style="background:rgba(200,240,96,0.08);border:1px solid rgba(200,240,96,0.2);border-radius:8px;padding:14px 16px;font-size:14px;color:var(--off)">';
      html += '<span style="color:var(--lime);font-weight:700">✓ You shared this week:</span><br>' + alreadySubmitted.text + '</div>';
    } else {
      html += '<div class="submission-form" style="background:transparent;border:none;padding:0;margin-top:0">';
      html += '<textarea class="submission-text" id="community-text" placeholder="What did you try? One sentence is fine."></textarea>';
      html += '<div class="submission-footer">';
      html += '<button class="btn-submit-phase" onclick="submitCommunity()">Share with community →</button>';
      html += '</div>';
      html += '<div class="submission-success" id="community-success"><span>✓</span><span>Shared! Thanks for contributing.</span></div>';
      html += '</div>';
    }
    html += '</div>';
    promptSection.innerHTML = html;

    // Load community feed for this hobby
    var feedEntries = await loadWeeklySubmissions(key);
    renderFeed(feedEntries, alreadySubmitted);
  }

  window.selectHobbyForCommunity = selectHobbyForCommunity;

  window.submitCommunity = async function() {
    var textEl = document.getElementById('community-text');
    var successEl = document.getElementById('community-success');
    if (!textEl || !textEl.value.trim()) {
      if (textEl) { textEl.style.borderColor = 'var(--coral)'; setTimeout(function() { textEl.style.borderColor = ''; }, 1500); }
      return;
    }

    var userId = currentUser ? currentUser.id : null;
    await saveWeeklySubmission(userId, currentKey, textEl.value.trim(), null);
    if (successEl) successEl.classList.add('visible');
    if (textEl) textEl.disabled = true;
    document.querySelectorAll('.btn-submit-phase').forEach(function(b) { b.style.display = 'none'; });
  };

  // Build hobby selector pills
  var HOBBY_ORDER_LOCAL = (typeof HOBBY_ORDER !== 'undefined') ? HOBBY_ORDER : Object.keys(HOBBIES || {});
  var selector = document.getElementById('hobby-selector');
  HOBBY_ORDER_LOCAL.slice(0, 12).forEach(function(key) {
    var h = HOBBIES && HOBBIES[key] ? HOBBIES[key] : null;
    if (!h) return;
    var btn = document.createElement('button');
    btn.className = 'hobby-tree-pill';
    btn.setAttribute('data-key', key);
    btn.onclick = function() { selectHobbyForCommunity(key); };
    btn.textContent = (h.icon || '') + ' ' + (key.charAt(0).toUpperCase() + key.slice(1));
    selector.appendChild(btn);
  });

  // Initialize
  getCurrentUser().then(async function(user) {
    currentUser = user;
    if (user) document.getElementById('nav-user').innerHTML = '<button onclick="signOut()" class="nav-signout">Sign out</button>';

    // Auto-select first hobby or top match
    var firstKey = null;
    try {
      var results = JSON.parse(sessionStorage.getItem('shrugResults'));
      if (results && results.ranked && results.ranked.length) firstKey = results.ranked[0].key;
    } catch(e) {}
    if (!firstKey) firstKey = HOBBY_ORDER_LOCAL[0];
    if (firstKey) selectHobbyForCommunity(firstKey);

    // Update My Arc nav
    var arcEl = document.getElementById('bnav-arc');
    var results2 = null;
    try { results2 = JSON.parse(sessionStorage.getItem('shrugResults')); } catch(e) {}
    if (arcEl && results2 && results2.ranked && results2.ranked.length) {
      arcEl.href = 'hobby.html?key=' + results2.ranked[0].key;
    }
  });
})();
</script>
</body>
</html>
