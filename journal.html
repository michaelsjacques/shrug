<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHRUG — Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111110">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="supabase.js"></script>
  <script src="db.js"></script>
  <script src="data.js"></script>
</head>
<body>

<nav class="bottom-nav" id="bottom-nav">
  <a href="index.html" class="bnav-item" data-page="discover"><span class="bnav-icon">🧭</span><span class="bnav-label">Discover</span></a>
  <a href="#" class="bnav-item" id="bnav-arc" data-page="arc"><span class="bnav-icon">🎯</span><span class="bnav-label">My Arc</span></a>
  <a href="shelf.html" class="bnav-item" data-page="shelf"><span class="bnav-icon">🖼️</span><span class="bnav-label">Shelf</span></a>
  <a href="map.html" class="bnav-item" data-page="map"><span class="bnav-icon">🗺️</span><span class="bnav-label">Map</span></a>
  <a href="community.html" class="bnav-item" data-page="community"><span class="bnav-icon">👥</span><span class="bnav-label">Community</span></a>
</nav>

<nav class="nav" id="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">SHRUG</a>
    <div id="nav-user"></div>
  </div>
</nav>

<div class="page-hero">
  <div class="page-hero-label">Your creative record</div>
  <div class="page-hero-heading">YOUR JOURNAL</div>
  <div class="page-hero-sub">Every challenge you've recorded, all in one place.</div>
</div>

<div class="page-content">
  <div style="padding-top:24px">
    <div class="journal-filter-bar" id="filter-bar">
      <button class="filter-pill active" data-hobby="all" onclick="filterBy('all')">All entries</button>
    </div>
    <div id="journal-feed">
      <div style="color:var(--mid);font-size:15px;padding:40px 0;text-align:center">Loading…</div>
    </div>
    <div id="empty-state" style="display:none;text-align:center;padding:60px 0">
      <div style="font-size:40px;margin-bottom:16px">📖</div>
      <div style="font-family:var(--font-display);font-size:28px;color:var(--off);letter-spacing:0.03em;margin-bottom:8px">NO ENTRIES YET</div>
      <div style="font-size:15px;color:var(--mid);margin-bottom:24px">Complete your first challenge to see it here.</div>
      <a href="results.html" class="btn-primary">Find a hobby →</a>
    </div>
  </div>
</div>

<script>
(function() {
  var allEntries = [];
  var currentFilter = 'all';
  var PHASE_LABELS = ['Week 1', 'Weeks 2–3', 'Month 1+'];

  function renderEntries(entries) {
    var feed = document.getElementById('journal-feed');
    var empty = document.getElementById('empty-state');
    if (!entries || entries.length === 0) {
      feed.style.display = 'none';
      empty.style.display = 'block';
      return;
    }
    feed.style.display = 'block';
    empty.style.display = 'none';

    feed.innerHTML = entries.map(function(e) {
      var hobbyData = HOBBIES && e.hobby_key ? HOBBIES[e.hobby_key] : null;
      var phaseIdx = e.chapter_idx !== undefined ? e.chapter_idx : (e.phase_idx || 0);
      var text = e.reflection || e.text || '';
      var date = e.completed_at || e.submitted_at || '';
      if (date) date = new Date(date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

      var html = '<div class="journal-entry">';
      html += '<div class="journal-entry-header">';
      if (hobbyData) html += '<span class="journal-hobby-pill" style="border-left:3px solid ' + (hobbyData.color || 'transparent') + '">' + (hobbyData.icon || '') + ' ' + (e.hobby_key.charAt(0).toUpperCase() + e.hobby_key.slice(1)) + '</span>';
      html += '<span class="journal-phase-badge">' + (PHASE_LABELS[phaseIdx] || 'Phase ' + (phaseIdx + 1)) + '</span>';
      if (date) html += '<span class="journal-date">' + date + '</span>';
      html += '</div>';
      if (text) html += '<div class="journal-text">' + text + '</div>';
      if (e.ai_feedback) {
        html += '<div class="journal-ai-feedback"><strong>AI feedback:</strong> ' + e.ai_feedback + '</div>';
      }
      html += '</div>';
      return html;
    }).join('');
  }

  function filterBy(hobby) {
    currentFilter = hobby;
    document.querySelectorAll('.filter-pill').forEach(function(p) {
      p.classList.toggle('active', p.getAttribute('data-hobby') === hobby);
    });
    var filtered = hobby === 'all' ? allEntries : allEntries.filter(function(e) { return e.hobby_key === hobby; });
    renderEntries(filtered);
  }

  window.filterBy = filterBy;

  async function load() {
    var user = await getCurrentUser();
    if (user) {
      document.getElementById('nav-user').innerHTML = '<button onclick="signOut()" class="nav-signout">Sign out</button>';
    }

    // Load entries from DB or localStorage
    var userId = user ? user.id : null;
    var entries = await loadJournalEntries(userId);

    // Also check localStorage anonymous entries
    var localKey = 'shrug_journal_anon';
    var local = [];
    try { local = JSON.parse(localStorage.getItem(localKey)) || []; } catch(e2) {}
    // Merge (deduplicate by text+hobby+phase)
    local.forEach(function(le) {
      var exists = entries.some(function(e) {
        return e.hobby_key === le.hobby_key && e.chapter_idx === le.phase_idx;
      });
      if (!exists) entries.push(le);
    });

    allEntries = entries;

    // Build filter pills from unique hobbies
    var hobbies = [];
    entries.forEach(function(e) { if (e.hobby_key && hobbies.indexOf(e.hobby_key) === -1) hobbies.push(e.hobby_key); });
    var filterBar = document.getElementById('filter-bar');
    hobbies.forEach(function(key) {
      var h = HOBBIES && HOBBIES[key] ? HOBBIES[key] : null;
      if (!h) return;
      var btn = document.createElement('button');
      btn.className = 'filter-pill';
      btn.setAttribute('data-hobby', key);
      btn.innerHTML = (h.icon || '') + ' ' + (key.charAt(0).toUpperCase() + key.slice(1));
      btn.onclick = function() { filterBy(key); };
      filterBar.appendChild(btn);
    });

    renderEntries(entries);

    // Update My Arc nav
    var arcEl = document.getElementById('bnav-arc');
    var results = null;
    try { results = JSON.parse(sessionStorage.getItem('shrugResults')); } catch(e2) {}
    if (arcEl && results && results.ranked && results.ranked.length) {
      arcEl.href = 'hobby.html?key=' + results.ranked[0].key;
    }
  }

  load();

  var navEl = document.getElementById('nav');
  window.addEventListener('scroll', function() { navEl.classList.toggle('stuck', window.scrollY > 10); }, { passive: true });
})();
</script>
</body>
</html>
