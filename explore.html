<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHRUG — Explore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111110">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="supabase.js"></script>
  <script src="db.js"></script>
  <script src="data.js"></script>
</head>
<body>

<nav class="bottom-nav" id="bottom-nav">
  <a href="index.html" class="bnav-item active" data-page="discover"><span class="bnav-icon">🧭</span><span class="bnav-label">Discover</span></a>
  <a href="results.html" class="bnav-item" id="bnav-arc" data-page="arc"><span class="bnav-icon">🎯</span><span class="bnav-label">My Arc</span></a>
  <a href="shelf.html" class="bnav-item" data-page="shelf"><span class="bnav-icon">🖼️</span><span class="bnav-label">Shelf</span></a>
  <a href="map.html" class="bnav-item" data-page="map"><span class="bnav-icon">🗺️</span><span class="bnav-label">Map</span></a>
  <a href="community.html" class="bnav-item" data-page="community"><span class="bnav-icon">👥</span><span class="bnav-label">Community</span></a>
</nav>

<nav class="nav" id="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">SHRUG</a>
    <div id="nav-user"></div>
  </div>
</nav>

<div class="page-hero">
  <div class="page-hero-label">Go deeper</div>
  <div class="page-hero-heading">EXPLORE NICHES</div>
  <div class="page-hero-sub">Every hobby has sub-worlds. Pick one and see where it leads.</div>
</div>

<div class="page-content">
  <div style="padding-top:28px">
    <div class="hobby-pill-row" id="pill-row">
      <!-- Pills populated by JS -->
    </div>
    <div id="niche-area">
      <div style="color:var(--mid);font-size:14px;padding:20px 0">Select a hobby above to explore its niches.</div>
    </div>
  </div>
</div>

<script>
(function() {
  var navEl = document.getElementById('nav');
  window.addEventListener('scroll', function() { navEl.classList.toggle('stuck', window.scrollY > 10); }, { passive: true });

  var currentKey = null;
  var completedHobbies = [];

  // Get completed hobbies from localStorage
  Object.keys(localStorage).forEach(function(k) {
    var m = k.match(/^shrug_phase_(.+)_\d$/);
    if (m && completedHobbies.indexOf(m[1]) === -1) completedHobbies.push(m[1]);
  });

  function selectHobby(key) {
    currentKey = key;
    // Update active pill
    document.querySelectorAll('.hobby-tree-pill').forEach(function(p) {
      p.classList.toggle('active', p.getAttribute('data-key') === key);
    });

    var niches = (typeof HOBBY_TREE !== 'undefined' && HOBBY_TREE[key]) ? HOBBY_TREE[key] : [];
    var h = HOBBIES && HOBBIES[key] ? HOBBIES[key] : null;

    var html = '';
    if (h) {
      html += '<div style="margin-bottom:20px"><span style="font-size:28px">' + (h.icon || '') + '</span> ';
      html += '<span style="font-family:var(--font-display);font-size:24px;letter-spacing:0.03em;color:var(--off)">' + key.toUpperCase() + '</span></div>';
    }

    if (niches.length === 0) {
      html += '<div style="color:var(--mid);font-size:14px">More niches for this hobby are coming soon.</div>';
    } else {
      html += '<div class="niche-grid">';
      niches.forEach(function(niche) {
        html += '<a href="hobby.html?key=' + key + '&niche=' + niche.id + '" class="niche-card">';
        html += '<div class="niche-icon">' + (niche.icon || '🎯') + '</div>';
        html += '<div class="niche-label">' + niche.label + '</div>';
        html += '<div class="niche-desc">' + (niche.desc || '') + '</div>';
        html += '</a>';
      });
      html += '</div>';
    }

    document.getElementById('niche-area').innerHTML = html;
  }

  window.selectHobby = selectHobby;

  // Build hobby pills
  var HOBBY_ORDER_LOCAL = (typeof HOBBY_ORDER !== 'undefined') ? HOBBY_ORDER : (typeof HOBBIES !== 'undefined' ? Object.keys(HOBBIES) : []);
  var pillRow = document.getElementById('pill-row');

  HOBBY_ORDER_LOCAL.forEach(function(key) {
    if (typeof HOBBY_TREE === 'undefined' || !HOBBY_TREE[key]) return;
    var h = HOBBIES && HOBBIES[key] ? HOBBIES[key] : null;
    var isDone = completedHobbies.indexOf(key) !== -1;
    var btn = document.createElement('button');
    btn.className = 'hobby-tree-pill';
    btn.setAttribute('data-key', key);
    btn.onclick = function() { selectHobby(key); };
    btn.innerHTML = (h ? (h.icon || '') + ' ' + (key.charAt(0).toUpperCase() + key.slice(1)) : key) +
      (isDone ? ' <span class="pill-check">✓</span>' : '');
    pillRow.appendChild(btn);
  });

  // Auto-select first pill or hobby from session
  var firstKey = null;
  try {
    var results = JSON.parse(sessionStorage.getItem('shrugResults'));
    if (results && results.ranked && results.ranked.length) {
      var topKey = results.ranked[0].key;
      if (typeof HOBBY_TREE !== 'undefined' && HOBBY_TREE[topKey]) firstKey = topKey;
    }
  } catch(e) {}
  if (!firstKey && HOBBY_ORDER_LOCAL.length) {
    firstKey = HOBBY_ORDER_LOCAL.find(function(k) { return typeof HOBBY_TREE !== 'undefined' && HOBBY_TREE[k]; });
  }
  if (firstKey) selectHobby(firstKey);

  // Update My Arc nav
  getCurrentUser().then(function(user) {
    if (user) document.getElementById('nav-user').innerHTML = '<button onclick="signOut()" class="nav-signout">Sign out</button>';
    var arcEl = document.getElementById('bnav-arc');
    var results2 = null;
    try { results2 = JSON.parse(sessionStorage.getItem('shrugResults')); } catch(e) {}
    if (arcEl && results2 && results2.ranked && results2.ranked.length) {
      arcEl.href = 'hobby.html?key=' + results2.ranked[0].key;
    }
  });
})();
</script>
</body>
</html>
