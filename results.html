<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHRUG — Your matches</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111110">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="supabase.js"></script>
  <script src="db.js"></script>
  <style>
    .results-header {
      padding: 24px var(--page-pad) 0;
      max-width: var(--page-max);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .results-logo {
      font-family: var(--font-display);
      font-size: 24px;
      letter-spacing: 0.04em;
      color: var(--off);
    }

    .results-main {
      max-width: var(--page-max);
      margin: 0 auto;
      padding: 36px var(--page-pad) 64px;
    }

    .results-eyebrow {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 8px;
    }
    .results-title {
      font-family: var(--font-display);
      font-size: clamp(36px, 6vw, 56px);
      letter-spacing: 0.02em;
      line-height: 1;
      color: var(--off);
      margin-bottom: 32px;
    }

    /* Hero card wrapper for animation */
    .hero-card-wrap {
      position: relative;
      overflow: hidden;
    }
    .hero-card-wrap .result-card {
      transition: opacity 0.25s, transform 0.25s;
    }
    .hero-card-wrap .result-card.exiting {
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
    }

    .why-section {
      margin-top: 36px;
    }
    .why-title {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 14px;
    }

    .also-section { margin-top: 48px; }
    .also-title {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 16px;
    }
    .also-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }

    .rejected-count {
      font-size: 12px;
      color: var(--mid);
      margin-top: 12px;
      min-height: 18px;
    }

    /* No results */
    .no-results {
      text-align: center;
      padding: 80px 20px;
    }
    .no-results-icon { font-size: 48px; margin-bottom: 16px; }
    .no-results h2 { font-family: var(--font-display); font-size: 32px; color: var(--off); margin-bottom: 12px; }
    .no-results p  { color: var(--mid); margin-bottom: 24px; }

    /* No session (came directly, not from quiz) */
    .no-session {
      text-align: center;
      padding: 80px var(--page-pad);
    }
    .no-session h2 {
      font-family: var(--font-display);
      font-size: 38px;
      color: var(--off);
      margin-bottom: 12px;
    }
    .no-session p { color: var(--mid); margin-bottom: 28px; }
  </style>
</head>
<body>

<nav class="bottom-nav" id="bottom-nav">
  <a href="index.html" class="bnav-item" data-page="discover"><span class="bnav-icon">🧭</span><span class="bnav-label">Discover</span></a>
  <a href="results.html" class="bnav-item active" id="bnav-arc" data-page="arc"><span class="bnav-icon">🎯</span><span class="bnav-label">My Arc</span></a>
  <a href="shelf.html" class="bnav-item" data-page="shelf"><span class="bnav-icon">🖼️</span><span class="bnav-label">Shelf</span></a>
  <a href="map.html" class="bnav-item" data-page="map"><span class="bnav-icon">🗺️</span><span class="bnav-label">Map</span></a>
  <a href="community.html" class="bnav-item" data-page="community"><span class="bnav-icon">👥</span><span class="bnav-label">Community</span></a>
</nav>

<header>
  <div class="results-header">
    <a href="index.html" class="results-logo">SHRUG</a>
    <a href="quiz.html" class="nav-link">Retake quiz</a>
  </div>
</header>

<main class="results-main" id="results-main">
  <!-- Populated by JS -->
</main>

<script src="data.js"></script>
<script src="quiz.js"></script>
<script>
(function() {
  var main = document.getElementById('results-main');
  var results = loadResults();
  var rejected = loadRejected();

  if (!results || !results.ranked || results.ranked.length === 0) {
    main.innerHTML =
      '<div class="no-session">' +
        '<h2>No quiz results found</h2>' +
        '<p>Take the quiz to get your personalized hobby matches.</p>' +
        '<a href="quiz.html" class="btn btn-primary">Take the quiz →</a>' +
      '</div>';
    return;
  }

  render(results, rejected);

  function render(results, rejected) {
    var ranked  = results.ranked;
    var answers = results.answers;
    var top     = ranked[0];
    var also    = ranked.slice(1, 4);

    if (!top) {
      main.innerHTML =
        '<div class="no-results">' +
          '<div class="no-results-icon">🤷</div>' +
          '<h2>You rejected everything</h2>' +
          '<p>That\'s fair. Start over with fresh eyes.</p>' +
          '<a href="quiz.html" class="btn btn-primary">Retake quiz</a>' +
        '</div>';
      return;
    }

    var rejectedCount = rejected.length;

    main.innerHTML =
      '<div class="results-eyebrow">Your best match</div>' +
      '<h1 class="results-title">Here\'s where to start.</h1>' +

      // Hero card
      '<div class="hero-card-wrap" id="hero-card-wrap">' +
        buildHeroCard(top.key, top.score, answers) +
      '</div>' +

      // Rejected count
      '<div class="rejected-count" id="rejected-count">' +
        (rejectedCount > 0 ? rejectedCount + ' rejected — ' + ranked.length + ' still showing' : '') +
      '</div>' +

      // Why section
      '<div class="why-section">' +
        '<div class="why-title">Why this matches you</div>' +
        '<div class="match-tags" id="why-tags">' +
          buildMatchTagsHTML(top.key, answers) +
        '</div>' +
      '</div>' +

      // Also strong
      '<div class="also-section">' +
        '<div class="also-title">Also strong matches</div>' +
        '<div class="also-grid" id="also-grid">' +
          also.map(function(r) { return buildSmallCard(r.key, r.score, answers); }).join('') +
        '</div>' +
      '</div>' +

      // Save section
      '<div class="save-section">' +
        '<h3>Save your results</h3>' +
        '<p>We\'ll send a link so you can come back to these anytime — no password needed.</p>' +
        '<div class="save-email-row">' +
          '<input type="email" class="save-email-input" id="save-email" placeholder="your@email.com">' +
          '<button class="save-submit" id="save-btn" onclick="submitSave()">Send link →</button>' +
        '</div>' +
        '<div id="save-msg" style="font-size:13px;color:var(--mid);margin-top:12px;min-height:18px"></div>' +
      '</div>';
  }

  function buildHeroCard(key, score, answers) {
    var h = HOBBIES[key];
    if (!h) return '';
    var pct  = Math.round(score);
    var tags = buildMatchTagsHTML(key, answers);

    return '<div class="result-card top" id="hero-card" style="border-top: 4px solid ' + (h.color || 'var(--gold)') + '">' +
      '<div class="result-card-header">' +
        '<div class="result-card-icon">' + (h.icon || '🎯') + '</div>' +
        '<div>' +
          '<div class="result-card-name">' + key.charAt(0).toUpperCase() + key.slice(1) + '</div>' +
          '<div class="result-card-tag">' + (h.tagline || '') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="result-score-bar">' +
        '<div class="result-score-fill" style="width:' + pct + '%"></div>' +
      '</div>' +
      '<div style="font-size:12px;color:var(--mid);margin-bottom:2px">' + pct + '% match</div>' +
      '<div class="result-actions">' +
        '<a href="hobby.html?key=' + key + '" class="btn-explore">Explore ' + key.charAt(0).toUpperCase() + key.slice(1) + ' →</a>' +
        '<button class="btn-nope" onclick="nopeHobby(\'' + key + '\')">Not for me →</button>' +
      '</div>' +
    '</div>';
  }

  function buildSmallCard(key, score, answers) {
    var h = HOBBIES[key];
    if (!h) return '';
    var pct = Math.round(score);
    return '<div class="result-sm" id="sm-' + key + '">' +
      '<div class="result-sm-header">' +
        '<span class="result-sm-icon">' + (h.icon || '🎯') + '</span>' +
        '<span class="result-sm-name">' + key.charAt(0).toUpperCase() + key.slice(1) + '</span>' +
      '</div>' +
      '<div class="result-sm-score-bar">' +
        '<div class="result-sm-score-fill" style="width:' + pct + '%"></div>' +
      '</div>' +
      '<div class="result-sm-actions">' +
        '<a href="hobby.html?key=' + key + '" class="result-sm-link">' + (h.tagline || 'Explore →') + '</a>' +
        '<button class="btn-nope btn-sm" onclick="nopeHobby(\'' + key + '\')">Nope</button>' +
      '</div>' +
    '</div>';
  }

  function buildMatchTagsHTML(key, answers) {
    var tags = getMatchTags(key, answers);
    return tags.map(function(t) {
      return '<span class="match-tag ' + (t.hit ? 'hit' : 'miss') + '">' +
        (t.hit ? '✓ ' : '✗ ') + t.label +
        '</span>';
    }).join('');
  }

  window.nopeHobby = function(key) {
    // Reject in storage
    var newRejected = rejectHobby(key);
    var newResults  = loadResults();
    if (!newResults) return;

    var ranked = newResults.ranked;

    // If top card was rejected, animate it out then re-render
    var heroCard = document.getElementById('hero-card');
    if (heroCard) {
      heroCard.classList.add('exiting');
      setTimeout(function() {
        render(newResults, newRejected);
        // Animate new hero card in
        var newHero = document.getElementById('hero-card');
        if (newHero) { newHero.style.opacity = '0'; newHero.style.transform = 'translateY(-10px)'; }
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            if (newHero) { newHero.style.transition = 'opacity 0.3s, transform 0.3s'; newHero.style.opacity = '1'; newHero.style.transform = 'translateY(0)'; }
          });
        });
      }, 220);
    } else {
      render(newResults, newRejected);
    }

    // Update rejected count
    var countEl = document.getElementById('rejected-count');
    if (countEl) {
      countEl.textContent = newRejected.length > 0
        ? newRejected.length + ' rejected — ' + ranked.length + ' still showing'
        : '';
    }
  };

  window.submitSave = async function() {
    var emailEl = document.getElementById('save-email');
    var msgEl = document.getElementById('save-msg');
    var email = emailEl ? emailEl.value.trim() : '';
    if (!email || !email.includes('@')) {
      if (msgEl) msgEl.textContent = 'Enter a valid email address.';
      return;
    }
    if (msgEl) msgEl.textContent = 'Sending…';
    var result = await sendMagicLink(email);
    if (result.error) {
      if (msgEl) msgEl.textContent = result.error.message || 'Something went wrong — try again.';
      return;
    }
    if (msgEl) msgEl.textContent = '✓ Check your email — your link is on the way.';
    if (emailEl) emailEl.disabled = true;
    var btn = document.getElementById('save-btn');
    if (btn) btn.disabled = true;
  };

})();

  // Save quiz results to DB when user signs in via magic link
  window.addEventListener('shrug:auth', async function(e) {
    if (e.detail.event === 'SIGNED_IN') {
      var user = e.detail.session.user;
      var results = loadResults();
      if (results) {
        await saveQuizResults(user.id, results.answers, results.ranked);
      }
    }
  });

  // Auto-scroll to save section if ?prompt=save in URL
  (function() {
    if (window.location.search.indexOf('prompt=save') !== -1) {
      var saveEl = document.querySelector('.save-section');
      if (saveEl) setTimeout(function() { saveEl.scrollIntoView({ behavior: 'smooth' }); }, 400);
    }
  })();
</script>
</body>
</html>
